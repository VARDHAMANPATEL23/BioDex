<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="112" fill="#0C0C10"/>
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="8"/>
  
  <g transform="translate(256, 256)">
    <!-- Eye / Leaf Shape representing Biological Sight -->
    <path d="M -150 0 C -75 -150, 75 -150, 150 0 C 75 150, -75 150, -150 0 Z" stroke="#D4AF37" stroke-width="24" stroke-linejoin="round" opacity="0.6" />
    
    <!-- Central Core / Iris -->
    <circle cx="0" cy="0" r="64" fill="#0C0C10" stroke="#FBBF24" stroke-width="24" />
    
    <!-- Crossed DNA/Data helix -->
    <path d="M -70 -100 C 0 -30, 0 30, 70 100" stroke="#D4AF37" stroke-width="24" stroke-linecap="round" />
    <path d="M 70 -100 C 0 -30, 0 30, -70 100" stroke="#FBBF24" stroke-width="24" stroke-linecap="round" />

    <!-- Connecting Rungs -->
    <line x1="-32" y1="-32" x2="32" y2="-32" stroke="#FBBF24" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <line x1="-32" y1="32" x2="32" y2="32" stroke="#FBBF24" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Tech nodes connecting the ecosystem -->
    <circle cx="-150" cy="0" r="16" fill="#FBBF24"/>
    <circle cx="150" cy="0" r="16" fill="#FBBF24"/>
    <circle cx="0" cy="-136" r="16" fill="#FBBF24"/>
    <circle cx="0" cy="136" r="16" fill="#FBBF24"/>
  </g>
</svg>
